spring:
  datasource:
    url: jdbc:h2:mem:colick-test;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop

  security:
    user:
      name: test
      password: test

  mail:
    host: localhost
    port: 1025
    username:
    password:
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

jwt:
  secret: test-secret-key-must-be-at-least-32-chars-long
  expiration-ms: 86400000
