<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nouveau litige - Coliclic</title>
</head>
<body style="margin:0;padding:0;background-color:#f5f5f5;font-family:Poppins,Arial,sans-serif;color:#111827;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f5f5f5;padding:24px 0;">
    <tr>
        <td align="center" style="padding:0 12px;">
            <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="width:100%;max-width:600px;background:#ffffff;border-radius:16px;overflow:hidden;">
                <tr>
                    <td style="background:#023047;padding:20px 24px;color:#ffffff;font-size:20px;font-weight:700;" th:text="#{email.common.brand}">Coliclic</td>
                </tr>
                <tr>
                    <td style="padding:28px 24px;">
                        <h1 style="margin:0 0 8px;font-size:24px;line-height:1.3;color:#023047;">Nouveau litige</h1>
                        <p style="margin:0 0 20px;color:#6b7280;" th:text="|Dossier n° ${id}|">Dossier n° 42</p>
                        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f9fafb;border-radius:10px;">
                            <tr>
                                <td style="padding:16px;line-height:1.6;overflow-wrap:anywhere;">
                                    <p style="margin:0;"><strong>E-mail du déclarant</strong><br /><span th:text="${senderEmail}">client@example.com</span></p>
                                    <p th:if="${tripReference != null}" style="margin:12px 0 0;"><strong>Référence du trajet</strong><br /><span th:text="${tripReference}">TRIP-1</span></p>
                                    <p th:if="${bookingReference != null}" style="margin:12px 0 0;"><strong>Référence de la réservation</strong><br /><span th:text="${bookingReference}">42</span></p>
                                </td>
                            </tr>
                        </table>
                        <h2 style="margin:24px 0 8px;font-size:16px;color:#023047;">Description</h2>
                        <p style="margin:0 0 24px;line-height:1.6;overflow-wrap:anywhere;"><th:block th:each="line, status : ${descriptionLines}"><span th:text="${line}">Description du litige</span><br th:unless="${status.last}" /></th:block></p>
                        <a th:href="${disputeUrl}" style="display:inline-block;background:#fb8500;color:#023047;text-decoration:none;border-radius:10px;padding:12px 18px;font-weight:700;">Voir le dossier</a>
                    </td>
                </tr>
                <tr>
                    <td style="background:#f9fafb;padding:16px 24px;font-size:12px;color:#6b7280;">
                        Vous pouvez répondre à cet e-mail pour contacter le déclarant.
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
