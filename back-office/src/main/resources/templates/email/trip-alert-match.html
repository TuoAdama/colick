<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="#{email.subject.tripAlertMatch}">New matching trip - Coliclic</title>
</head>
<body style="margin:0;padding:0;background-color:#f5f5f5;font-family:Poppins,Arial,sans-serif;color:#111827;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f5f5f5;padding:24px 0;">
    <tr>
        <td align="center">
            <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;background:#ffffff;border-radius:16px;overflow:hidden;">
                <tr>
                    <td style="background:#023047;padding:20px 24px;color:#ffffff;font-size:20px;font-weight:700;" th:text="#{email.common.brand}">Coliclic</td>
                </tr>
                <tr>
                    <td style="padding:28px 24px;">
                        <p style="margin:0 0 12px 0;font-size:16px;" th:text="#{email.common.greeting(${firstName})}">Hello User,</p>
                        <p style="margin:0 0 20px 0;line-height:1.6;" th:text="#{email.tripAlertMatch.intro(${departureAddress}, ${destination})}">A matching trip is available.</p>
                        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:0 0 22px 0;background:#F9FAFB;border-radius:12px;padding:16px;">
                            <tr>
                                <td style="padding:4px 0;color:#6B7280;font-size:13px;" th:text="#{email.tripAlertMatch.departureDateLabel}">Departure date</td>
                                <td align="right" style="padding:4px 0;font-weight:700;" th:text="${#temporals.format(departureTime, 'dd MMM yyyy HH:mm')}">20 Jun 2026 10:00</td>
                            </tr>
                            <tr>
                                <td style="padding:4px 0;color:#6B7280;font-size:13px;" th:text="#{email.tripAlertMatch.priceLabel}">Price per kg</td>
                                <td align="right" style="padding:4px 0;font-weight:700;" th:text="${pricePerKilo + ' €/kg'}">5 €/kg</td>
                            </tr>
                        </table>
                        <p style="margin:0 0 24px 0;line-height:1.6;color:#6B7280;" th:text="#{email.tripAlertMatch.note}">Open Coliclic to review the trip and send a booking request.</p>
                        <a th:href="${searchUrl}" style="display:inline-block;background:#fb8500;color:#ffffff;text-decoration:none;border-radius:10px;padding:12px 18px;font-weight:700;" th:text="#{email.tripAlertMatch.cta}">View trip</a>
                    </td>
                </tr>
                <tr>
                    <td style="background:#F9FAFB;padding:16px 24px;font-size:12px;color:#6B7280;">
                        <span th:text="#{email.common.help}">Need help?</span>
                        <span style="color:#219ebc;" th:text="${supportEmail}">support@coliclic.app</span>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
