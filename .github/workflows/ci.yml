name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  commercial-config-check:
    name: commercial-config-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Reject hard-coded commission values
        shell: bash
        run: |
          matches=$(rg --pcre2 -n '(?<![0-9])0\.07(?![0-9])|(?<![0-9])7\s?%' front-office/src/app back-office/src/main/java \
            --glob '!commercial-content.service.ts' \
            --glob '!CommercialMode.java' \
            --glob '!*.spec.ts' || true)
          if [[ -n "$matches" ]]; then
            echo "Commission values must remain in the commercial profile catalog:"
            echo "$matches"
            exit 1
          fi

  backend-tests:
    name: backend-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: back-office/pom.xml

      - name: Run back-office tests
        working-directory: back-office
        run: ./mvnw -B verify

  frontend-tests:
    name: frontend-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: front-office/package-lock.json

      - name: Install front-office dependencies
        working-directory: front-office
        run: npm ci

      - name: Run front-office tests
        working-directory: front-office
        run: npm test -- --watch=false --browsers=ChromeHeadless

  frontend-build:
    name: frontend-build
    needs: frontend-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: front-office/package-lock.json

      - name: Install front-office dependencies
        working-directory: front-office
        run: npm ci

      - name: Build front-office
        working-directory: front-office
        run: npm run build
