@if (showSharedChrome) {
  <!-- Skip link for accessibility -->
  <a
    [routerLink]="currentPagePath"
    queryParamsHandling="preserve"
    fragment="main"
    (click)="focusMainContent()"
    class="sr-only focus:not-sr-only focus:absolute focus:top-4 focus:left-4 bg-accent text-white px-4 py-2 rounded-lg z-50 font-medium"
  >
    Aller au contenu principal
  </a>

  <!-- Header Navigation -->
  <app-header />
}

<!-- Main Content -->
<main id="main" tabindex="-1" [class.pb-20]="showMobileBottomSearchNavigation" [class.md:pb-0]="showMobileBottomSearchNavigation">
  <router-outlet />
</main>

@if (showSharedChrome) {
  <!-- Footer -->
  <app-footer />
}

@if ((authService.currentUser$ | async) && showMobileBottomSearchNavigation) {
  <nav class="fixed inset-x-0 bottom-0 z-30 flex h-20 border-t border-border bg-background-secondary/95 px-2 pb-[env(safe-area-inset-bottom)] pt-2 shadow-[0_-4px_16px_rgba(15,23,42,0.08)] backdrop-blur-md md:hidden" aria-label="Navigation principale mobile" data-testid="mobile-bottom-navigation">
    <a routerLink="/search" routerLinkActive="!text-primary" [routerLinkActiveOptions]="{ exact: true }" class="flex min-w-0 flex-1 flex-col items-center justify-center gap-1 rounded-lg px-1 text-[10px] font-semibold text-text-secondary" aria-label="Rechercher un trajet"><svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path stroke-linecap="round" d="m16 16 4 4"/></svg><span>Rechercher</span></a>
    <a routerLink="/trips" routerLinkActive="!text-primary" class="flex min-w-0 flex-1 flex-col items-center justify-center gap-1 rounded-lg px-1 text-[10px] font-semibold text-text-secondary" aria-label="Mes voyages"><svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" d="M5 19c0-5.5 2.5-9 7-9h2c3 0 5-2 5-5"/><circle cx="5" cy="19" r="2"/><circle cx="19" cy="5" r="2"/></svg><span>Voyages</span></a>
    <a routerLink="/sent-bookings" routerLinkActive="!text-primary" class="flex min-w-0 flex-1 flex-col items-center justify-center gap-1 rounded-lg px-1 text-[10px] font-semibold text-text-secondary" aria-label="Mes demandes envoyées"><svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2Z"/></svg><span>Demandes</span></a>
    <a routerLink="/messages" routerLinkActive="!text-primary" class="flex min-w-0 flex-1 flex-col items-center justify-center gap-1 rounded-lg px-1 text-[10px] font-semibold text-text-secondary" aria-label="Messages"><svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M8 10h.01M12 10h.01M16 10h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 0 1-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8Z"/></svg><span>Messages</span></a>
    <a routerLink="/settings" routerLinkActive="!text-primary" class="flex min-w-0 flex-1 flex-col items-center justify-center gap-1 rounded-lg px-1 text-[10px] font-semibold text-text-secondary" aria-label="Mon profil"><svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8"/><path stroke-linecap="round" d="M5 21a7 7 0 0 1 14 0"/></svg><span>Profil</span></a>
  </nav>
}
