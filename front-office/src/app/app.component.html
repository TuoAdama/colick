@if (showSharedChrome) {
  <!-- Skip link for accessibility -->
  <a
    [routerLink]="currentPagePath"
    queryParamsHandling="preserve"
    fragment="main"
    (click)="focusMainContent()"
    class="sr-only focus:not-sr-only focus:absolute focus:top-4 focus:left-4 bg-accent text-white px-4 py-2 rounded-lg z-50 font-medium"
  >
    Aller au contenu principal
  </a>

  <!-- Header Navigation -->
  <app-header />
}

<!-- Main Content -->
<main id="main" tabindex="-1">
  <router-outlet />
</main>

@if (showSharedChrome) {
  <!-- Footer -->
  <app-footer />
}

@if (analytics.consentRequired()) {
  <aside class="fixed inset-x-4 bottom-4 z-50 mx-auto max-w-2xl rounded-2xl border border-border bg-white p-5 shadow-xl" role="dialog" aria-label="Préférences de mesure d’audience">
    <p class="text-sm leading-6 text-text-secondary">Nous utilisons Google Analytics uniquement avec votre accord pour comprendre les étapes où les utilisateurs abandonnent. Aucun nom, e-mail ou téléphone n’est transmis.</p>
    <div class="mt-4 flex flex-wrap justify-end gap-3">
      <button type="button" class="btn-outline !py-2.5 !text-sm" (click)="analytics.decline()">Refuser</button>
      <button type="button" class="btn-primary !py-2.5 !text-sm" (click)="analytics.accept()">Accepter la mesure</button>
    </div>
  </aside>
}
