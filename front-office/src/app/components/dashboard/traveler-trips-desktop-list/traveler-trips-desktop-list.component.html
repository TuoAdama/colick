<div class="hidden lg:block">
  <div class="overflow-hidden rounded-[1.5rem] border border-background-primary bg-white shadow-sm">
    <div class="grid grid-cols-[minmax(0,2.2fr)_1fr_0.8fr_0.8fr_0.9fr_auto] gap-4 border-b border-background-primary bg-background-secondary px-6 py-4 text-xs font-semibold uppercase tracking-[0.16em] text-text-secondary">
      <span>Trajet</span>
      <span>Date</span>
      <span>Poids max</span>
      <span>Prix/kg</span>
      <span>Status</span>
      <span class="text-right">Actions</span>
    </div>

    <div class="divide-y divide-background-primary">
      @for (trip of trips; track trip.id) {
        <div
          class="grid grid-cols-[minmax(0,2.2fr)_1fr_0.8fr_0.8fr_0.9fr_auto] items-center gap-4 px-6 py-4 transition"
          [class.bg-background-secondary]="selectedTripId === trip.id"
        >
          <div class="min-w-0">
            <p class="truncate text-sm font-semibold text-text-primary">
              {{ trip.departureAddress }} -> {{ trip.destination }}
            </p>
          </div>

          <div class="text-sm text-text-primary">
            {{ trip.departureTime | date:'dd/MM/yyyy' }}
          </div>

          <div class="text-sm text-text-primary">
            {{ trip.maxWeight }} kg
          </div>

          <div class="text-sm text-text-primary">
            {{ trip.pricePerKilo | number:'1.0-2' }} €/kg
          </div>

          <div>
            <span [class]="tripStatusClass(trip.status) + ' inline-flex rounded-full px-3 py-1 text-xs font-semibold'">
              {{ tripStatusLabel(trip.status) }}
            </span>
          </div>

          <div class="flex items-center justify-end gap-2">
            <button
              type="button"
              class="relative inline-flex h-10 w-10 items-center justify-center rounded-full text-text-secondary transition hover:bg-background-secondary hover:text-secondary focus:outline-none focus:ring-2 focus:ring-secondary/20"
              [ngClass]="selectedTripId === trip.id ? 'bg-secondary/10 text-secondary' : ''"
              (click)="onSelect(trip.id)"
              [attr.aria-pressed]="selectedTripId === trip.id"
              aria-label="Voir les demandes pour ce trajet"
            >
              <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12S5.25 6.75 12 6.75 21.75 12 21.75 12 18.75 17.25 12 17.25 2.25 12 2.25 12z" />
                <circle cx="12" cy="12" r="3.25" />
              </svg>
              <span class="absolute -right-1 -top-1 inline-flex min-w-[1.2rem] items-center justify-center rounded-full bg-accent px-1 text-[0.65rem] font-bold leading-5 text-white">
                {{ bookingCount(trip.id) }}
              </span>
            </button>

            <button
              type="button"
              class="inline-flex h-10 w-10 items-center justify-center rounded-full text-text-secondary transition hover:bg-background-secondary hover:text-secondary focus:outline-none focus:ring-2 focus:ring-secondary/20 disabled:cursor-not-allowed disabled:opacity-35"
              [disabled]="trip.status !== 'ACTIVE'"
              (click)="onEditTrip(trip.id)"
              aria-label="Modifier ce trajet"
            >
              <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4 20h4l10.5-10.5a2.121 2.121 0 10-3-3L5 17v3z" />
              </svg>
            </button>

            <app-trip-options-menu
              [tripId]="trip.id"
              [tripLabel]="trip.departureAddress + ' vers ' + trip.destination"
              [canDownload]="trip.status === 'ACTIVE'"
              [showDeleteOption]="true"
              [canDelete]="canDeleteTrip(trip)"
              [canCancel]="trip.status === 'ACTIVE'"
              [canComplete]="trip.status === 'ACTIVE'"
              [isDownloading]="generatingShareCardTripId === trip.id"
              [isDeleting]="isDeletingTrip"
              [isCompleting]="completingTripId === trip.id"
              (downloadPng)="downloadTripShareCard.emit($event)"
              (deleteTrip)="onDeleteTrip($event)"
              (cancelTrip)="onCancelTrip($event)"
              (completeTrip)="markTripCompleted.emit($event)"
            />
          </div>
        </div>
      }
    </div>
  </div>
</div>
